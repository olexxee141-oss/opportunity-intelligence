services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: oi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opportunity_intelligence
    ports:
      - "5432:5432"
    volumes:
      - oi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opportunity_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: oi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - oi-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  oi-postgres-data:
  oi-redis-data:
